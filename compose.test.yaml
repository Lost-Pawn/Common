services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: common_test
      POSTGRES_USER: common
      POSTGRES_PASSWORD: common-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U common -d common_test]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    image: golang:1.27.1-alpine
    working_dir: /src
    volumes:
      - ./backend:/src:ro
    environment:
      TEST_DATABASE_URL: postgres://common:common-test-only@db:5432/common_test?sslmode=disable
      GOCACHE: /tmp/go-build
    command: [go, test, -v, ./...]
    depends_on:
      db:
        condition: service_healthy
